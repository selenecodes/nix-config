name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # main 2026-07-15
        with:
          fail-mode: true
          ignore-missing-flake-lock: false

  vulnix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main 2026-07-15
        with:
          determinate: false
      - name: Build NixOS system closure
        run: nix build .#nixosConfigurations.gayming.config.system.build.toplevel
      - name: Scan closure for CVEs
        run: nix run github:nix-community/vulnix/c0a930a55f4ef7026a41bcc1d39261d92f488b8b -- --json ./result > vulnix.json
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnix-report
          path: vulnix.json
